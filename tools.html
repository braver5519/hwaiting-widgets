<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>화이팅!쌤 수업 도구함</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Black+Han+Sans&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#f6f3ff;font-family:'Gowun Dodum',system-ui,sans-serif;color:#2b1d55}
.wrap{padding:16px;max-width:900px;margin:0 auto}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:0;padding:10px 16px;border-radius:999px;background:#fff;font:inherit;font-size:15px;cursor:pointer;box-shadow:0 2px 0 #d9d0ff}
.tabs button.on{background:#7b5cff;color:#fff}
.pane{display:none;background:#fff;border-radius:22px;padding:20px;box-shadow:0 4px 0 #d9d0ff;min-height:300px}
.pane.on{display:block}
h2{font-family:'Black Han Sans',sans-serif;font-size:20px;color:#7b5cff;margin-bottom:10px}
.big{font-family:'Black Han Sans',sans-serif;font-size:clamp(64px,16vw,140px);text-align:center;color:#2b1d55;line-height:1.1}
.big.done{color:#ff4d7d;animation:b .5s infinite alternate}@keyframes b{to{transform:scale(1.05)}}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.btn{border:0;padding:10px 16px;border-radius:14px;font:inherit;font-size:15px;cursor:pointer;background:#efeaff;color:#2b1d55}
.btn.p{background:#7b5cff;color:#fff}.btn.k{background:#ff7aa8;color:#fff}
textarea{width:100%;height:90px;border:2px solid #e6dfff;border-radius:14px;padding:10px;font:inherit;font-size:14px}
.pick{font-family:'Black Han Sans',sans-serif;font-size:clamp(40px,10vw,90px);text-align:center;color:#ff4d7d;min-height:110px;display:flex;align-items:center;justify-content:center}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.g{background:#fff8e7;border:2px solid #ffd76a;border-radius:14px;padding:10px}
.g b{color:#ff8a00}
.lbl{font-size:13px;color:#7a6aa8;margin:6px 0}
.trf{display:flex;justify-content:center;gap:18px;margin-top:10px}
.lt{width:70px;height:70px;border-radius:50%;background:#eee;opacity:.25}
.lt.on{opacity:1}.r{background:#ff4d4d}.y{background:#ffc400}.gr{background:#2ecc71}
</style></head>
<body><div class="wrap">
<div class="tabs">
<button class="on" data-t="timer">⏱️ 타이머</button>
<button data-t="pick">🎲 발표자 뽑기</button>
<button data-t="grp">👥 모둠 나누기</button>
<button data-t="noise">🚦 활동 신호등</button>
</div>

<div class="pane on" id="timer"><h2>⏱️ 수업 타이머</h2>
<div class="big" id="tm">05:00</div>
<div class="row">
<button class="btn" onclick="setT(60)">1분</button><button class="btn" onclick="setT(180)">3분</button><button class="btn" onclick="setT(300)">5분</button><button class="btn" onclick="setT(600)">10분</button><button class="btn" onclick="setT(900)">15분</button>
<button class="btn" onclick="addT(30)">+30초</button>
</div>
<div class="row"><button class="btn p" id="go" onclick="toggle()">▶ 시작</button><button class="btn k" onclick="setT(base)">↺ 다시</button></div>
</div>

<div class="pane" id="pick"><h2>🎲 발표자 뽑기</h2>
<div class="lbl">학생 이름을 줄바꿈 또는 쉼표로 입력하세요 (학생 명렬표에서 이름 열을 복사해 붙여넣기 OK!)</div>
<textarea id="names" placeholder="예) 김하늘&#10;이바다&#10;박나무"></textarea>
<label class="lbl"><input type="checkbox" id="nodup" checked> 한 번 뽑힌 학생은 제외</label>
<div class="pick" id="pk">두근두근 🎉</div>
<div class="row"><button class="btn p" onclick="pick()">🎲 뽑기!</button><button class="btn" onclick="resetPick()">↺ 초기화</button></div>
<div class="lbl" id="used"></div>
</div>

<div class="pane" id="grp"><h2>👥 랜덤 모둠 나누기</h2>
<div class="lbl">위 '발표자 뽑기' 탭에 입력한 명단을 사용해요</div>
<div class="row"><span class="lbl">모둠 수</span><button class="btn" onclick="g(2)">2</button><button class="btn" onclick="g(3)">3</button><button class="btn" onclick="g(4)">4</button><button class="btn" onclick="g(5)">5</button><button class="btn" onclick="g(6)">6</button></div>
<div class="groups" id="gs"></div>
</div>

<div class="pane" id="noise"><h2>🚦 활동 신호등</h2>
<div class="trf"><div class="lt r" id="l0"></div><div class="lt y" id="l1"></div><div class="lt gr on" id="l2"></div></div>
<div class="pick" id="nm" style="font-size:40px">🟢 자유롭게 이야기해요</div>
<div class="row"><button class="btn" onclick="ln(0)">🔴 조용히</button><button class="btn" onclick="ln(1)">🟡 짝과 속삭이기</button><button class="btn" onclick="ln(2)">🟢 모둠 대화</button></div>
</div>
</div>
<script>
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button,.pane').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.t).classList.add('on');});
let base=300,left=300,iv=null;const tm=document.getElementById('tm');
function show(){tm.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');tm.classList.toggle('done',left===0);}
function setT(s){base=s;left=s;stop();show();}
function addT(s){left+=s;show();}
function stop(){clearInterval(iv);iv=null;document.getElementById('go').textContent='▶ 시작';}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(t=>{const o=c.createOscillator();o.frequency.value=880;o.connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+.2);});}catch(e){}}
function toggle(){if(iv){stop();return;}if(left===0)left=base;document.getElementById('go').textContent='⏸ 일시정지';iv=setInterval(()=>{left--;show();if(left<=0){left=0;show();stop();beep();}},1000);}
show();
const ta=document.getElementById('names');try{ta.value=localStorage.getItem('ht_names')||'';}catch(e){}
ta.oninput=()=>{try{localStorage.setItem('ht_names',ta.value);}catch(e){}};
let used=[];
function list(){return ta.value.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean);}
function pick(){let L=list();if(document.getElementById('nodup').checked)L=L.filter(n=>!used.includes(n));
const pk=document.getElementById('pk');if(!L.length){pk.textContent=list().length?'모두 뽑혔어요! 🎊':'명단을 입력해 주세요';return;}
let i=0;const sp=setInterval(()=>{pk.textContent=L[Math.floor(Math.random()*L.length)];if(++i>15){clearInterval(sp);const w=L[Math.floor(Math.random()*L.length)];pk.textContent='🎉 '+w;used.push(w);document.getElementById('used').textContent='뽑힌 학생: '+used.join(', ');}},70);}
function resetPick(){used=[];document.getElementById('used').textContent='';document.getElementById('pk').textContent='두근두근 🎉';}
function g(n){const L=list().sort(()=>Math.random()-.5);const gs=document.getElementById('gs');gs.innerHTML='';if(!L.length){gs.innerHTML='<div class="lbl">명단을 먼저 입력해 주세요</div>';return;}
const G=Array.from({length:n},()=>[]);L.forEach((x,i)=>G[i%n].push(x));G.forEach((m,i)=>{gs.innerHTML+='<div class="g"><b>'+(i+1)+'모둠</b><br>'+m.join('<br>')+'</div>';});}
const msg=['🔴 쉿! 조용히 집중해요','🟡 짝과 작은 목소리로','🟢 모둠끼리 자유롭게 이야기해요'];
function ln(k){[0,1,2].forEach(i=>document.getElementById('l'+i).classList.toggle('on',i===k));document.getElementById('nm').textContent=msg[k];}
</script></body></html>
