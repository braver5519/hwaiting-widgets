<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>화이팅!쌤 D-day</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Black+Han+Sans&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:transparent;font-family:'Gowun Dodum',system-ui,sans-serif}
.card{min-height:170px;height:100%;border-radius:22px;padding:16px 18px;background:#fff8e7;border:2px solid #ffd76a;color:#3b2a00}
.top{display:flex;justify-content:space-between;align-items:baseline}
.ttl{font-family:'Black Han Sans',sans-serif;font-size:18px;color:#ff8a00}
.wk{font-size:13px;background:#ffe9a8;padding:3px 10px;border-radius:999px}
.bar{height:12px;border-radius:999px;background:#ffeec2;margin:10px 0 4px;overflow:hidden}
.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#ffb800,#ff6a8a);transition:width .6s}
.pct{font-size:12px;color:#8a6a1a}
.list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.d{background:#fff;border-radius:14px;padding:8px 6px;text-align:center;box-shadow:0 2px 0 #ffd76a;cursor:pointer}
.d b{display:block;font-family:'Black Han Sans',sans-serif;font-size:22px;color:#7b5cff}
.d span{font-size:12px}
.d input{width:100%;font-size:11px;border:1px solid #ffd76a;border-radius:6px;margin-top:4px;display:none}
.d.edit input{display:block}
.hint{font-size:11px;color:#a08a50;margin-top:8px;text-align:right}
</style></head>
<body><div class="card">
<div class="top"><div class="ttl">📆 2027학년도 진행률</div><div class="wk" id="wk"></div></div>
<div class="bar"><div class="fill" id="f" style="width:0"></div></div>
<div class="pct" id="pc"></div>
<div class="list" id="L"></div>
<div class="hint">💡 카드를 누르면 우리 학교 날짜로 바꿀 수 있어요</div>
</div>
<script>
const START=new Date(2027,2,2), END=new Date(2028,1,29);
const DEF=[{n:'☀️ 여름방학',d:'2027-07-23'},{n:'⛄ 겨울방학',d:'2028-01-07'},{n:'🎓 학년 마무리',d:'2028-02-29'}];
let items=DEF;try{const s=localStorage.getItem('ht_dday');if(s)items=JSON.parse(s);}catch(e){}
function save(){try{localStorage.setItem('ht_dday',JSON.stringify(items));}catch(e){}}
function day0(x){return new Date(x.getFullYear(),x.getMonth(),x.getDate());}
function render(){const now=day0(new Date());
let p=(now-START)/(END-START);p=Math.max(0,Math.min(1,p));
document.getElementById('f').style.width=(p*100).toFixed(1)+'%';
if(now<START){const dd=Math.round((START-now)/864e5);document.getElementById('pc').textContent='새 학년까지 D-'+dd+' · 설렘 가득한 준비 기간!';document.getElementById('wk').textContent='준비 중';}
else{document.getElementById('pc').textContent=(p*100).toFixed(1)+'% 지나왔어요 · 오늘도 한 걸음!';
document.getElementById('wk').textContent=Math.floor((now-START)/6048e5)+1+'주차';}
const L=document.getElementById('L');L.innerHTML='';
items.forEach((it,i)=>{const t=new Date(it.d+'T00:00:00');const diff=Math.round((t-now)/864e5);
const el=document.createElement('div');el.className='d';
el.innerHTML='<b>'+(diff>0?'D-'+diff:diff===0?'D-DAY':'D+'+(-diff))+'</b><span>'+it.n+'</span><input type="date" value="'+it.d+'">';
el.onclick=e=>{if(e.target.tagName!=='INPUT')el.classList.toggle('edit');};
el.querySelector('input').onchange=e=>{items=items.map(x=>({...x}));items[i].d=e.target.value;save();render();};
L.appendChild(el);});}
render();setInterval(render,60000);
</script></body></html>
