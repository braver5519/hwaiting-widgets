<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>화이팅!쌤 시계</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:transparent;font-family:Pretendard,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.card{position:relative;overflow:hidden;height:100%;min-height:190px;border-radius:20px;padding:26px 30px;color:#eef0ff;
background:radial-gradient(120% 140% at 0% 0%,#2a2f6b 0%,#141a3a 45%,#0b1026 100%);display:flex;align-items:center;gap:28px}
.glow{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;pointer-events:none}
.g1{width:260px;height:260px;background:#7b5cff;right:-60px;top:-90px}
.g2{width:200px;height:200px;background:#ff7aa8;right:160px;bottom:-140px;opacity:.35}
.left{flex:1;min-width:0;position:relative;z-index:1}
.label{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#9aa3d9;font-weight:600}
.time{font-weight:200;font-size:clamp(48px,9vw,84px);line-height:1;letter-spacing:-.02em;margin-top:8px;font-variant-numeric:tabular-nums}
.time b{font-weight:600}
.time .sec{font-size:.32em;font-weight:300;color:#9aa3d9;margin-left:8px;letter-spacing:0}
.date{margin-top:10px;font-size:15px;font-weight:500;color:#d4d8ff}
.date span{color:#9aa3d9;font-weight:400;margin-left:6px}
.msg{margin-top:14px;font-size:13px;color:#b9bff0;font-weight:400}
.prog{margin-top:16px;max-width:420px}
.prog .row{display:flex;justify-content:space-between;font-size:11px;color:#8c95cf;letter-spacing:.02em}
.bar{height:4px;border-radius:99px;background:rgba(255,255,255,.1);margin-top:6px;overflow:hidden}
.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#8f7bff,#ff8fb8)}
.right{position:relative;z-index:1;flex:none}
svg{display:block;width:150px;height:150px}
@media (max-width:520px){.right{display:none}.card{padding:22px}}
</style></head>
<body><div class="card">
<div class="glow g1"></div><div class="glow g2"></div>
<div class="left">
<div class="label" id="lb">Good Day, Teacher</div>
<div class="time"><b id="hh">--</b>:<span id="mm">--</span><span class="sec" id="ss">--</span></div>
<div class="date" id="dt"></div>
<div class="msg" id="msg"></div>
<div class="prog"><div class="row"><span id="py">2027학년도</span><span id="pp"></span></div><div class="bar"><div class="fill" id="pf" style="width:0"></div></div></div>
</div>
<div class="right">
<svg viewBox="0 0 120 120">
<defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8f7bff"/><stop offset="1" stop-color="#ff8fb8"/></linearGradient></defs>
<circle cx="60" cy="60" r="54" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.12)" stroke-width="1"/>
<circle id="arc" cx="60" cy="60" r="54" fill="none" stroke="url(#gr)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="339.3" transform="rotate(-90 60 60)"/>
<g id="ticks"></g>
<line id="hr" x1="60" y1="60" x2="60" y2="32" stroke="#eef0ff" stroke-width="3.5" stroke-linecap="round"/>
<line id="mn" x1="60" y1="60" x2="60" y2="20" stroke="#cfd4ff" stroke-width="2" stroke-linecap="round"/>
<circle cx="60" cy="60" r="3.5" fill="#ff8fb8"/>
</svg>
</div>
</div>
<script>
const W=['일','월','화','수','목','금','토'];
const T=document.getElementById('ticks');
for(let i=0;i<12;i++){const a=i*30*Math.PI/180,r1=i%3?47:44,r2=50;
const l=document.createElementNS('http://www.w3.org/2000/svg','line');
l.setAttribute('x1',60+r1*Math.sin(a));l.setAttribute('y1',60-r1*Math.cos(a));l.setAttribute('x2',60+r2*Math.sin(a));l.setAttribute('y2',60-r2*Math.cos(a));
l.setAttribute('stroke',i%3?'rgba(255,255,255,.25)':'rgba(255,255,255,.6)');l.setAttribute('stroke-width',i%3?1:1.6);T.appendChild(l);}
const msgs=['오늘의 기록 한 줄이 학기말을 가볍게 합니다.','완벽보다 꾸준함, 오늘도 한 걸음.','아이들 곁의 선생님이 가장 큰 교육과정입니다.','잠깐 숨 고르고, 물 한 잔 어떠세요?','오늘 칭찬할 학생 한 명을 떠올려 보세요.','작은 성공을 기록하는 하루가 되길.'];
function hand(id,deg,len){const a=deg*Math.PI/180;const e=document.getElementById(id);e.setAttribute('x2',60+len*Math.sin(a));e.setAttribute('y2',60-len*Math.cos(a));}
function tick(){const n=new Date(),h=n.getHours(),m=n.getMinutes(),s=n.getSeconds();
hh.textContent=String(h).padStart(2,'0');mm.textContent=String(m).padStart(2,'0');ss.textContent=String(s).padStart(2,'0');
dt.innerHTML=n.getFullYear()+'. '+(n.getMonth()+1)+'. '+n.getDate()+'.<span>'+W[n.getDay()]+'요일</span>';
lb.textContent=h<11?'Good Morning, Teacher':h<17?'Good Afternoon, Teacher':'Good Evening, Teacher';
msg.textContent=msgs[(n.getDate()+n.getMonth())%msgs.length];
hand('hr',(h%12)*30+m*.5,28);hand('mn',m*6+s*.1,40);
document.getElementById('arc').setAttribute('stroke-dashoffset',339.3*(1-(s+1)/60));
const S=new Date(2027,2,2),E=new Date(2028,1,29);let p=(n-S)/(E-S);
if(p<0){py.textContent='2027학년도 시작까지';pp.textContent='D-'+Math.ceil((S-n)/864e5);pf.style.width='0%';}
else{p=Math.min(1,p);py.textContent='2027학년도 진행률';pp.textContent=(p*100).toFixed(1)+'%';pf.style.width=(p*100)+'%';}}
tick();setInterval(tick,1000);
</script></body></html>
